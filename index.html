</style></head><body><header><div class="brand">时空对望<small>PARALLEL HISTORIES</small></div><div class="nav"><button id="home">时间长河</button><button id="random">随机穿越</button></div></header><section class="hero"><div class="eyebrow">A JOURNEY THROUGH SHARED TIME</div><h1>时间，是文明共同的坐标。</h1><p>同一个时代，中国与世界的另一端，正在书写怎样的故事？<br>拖动时间，探索相遇与错过的历史。</p></section><main class="shell"><section class="panel"><div class="panelhead"><div><div class="hint">CURRENT TIME · 当前时间</div><div class="date" id="date"></div></div><div class="hint">公元前 1600 年 — 公元 1949 年</div></div><div class="toolbar"><button id="minus" aria-label="缩小">− 缩小</button><button id="plus" aria-label="放大">＋ 放大</button><button id="back">◀ 前进百年</button><button id="forward">后退百年 ▶</button><input id="search" placeholder="搜索历史事件，如：唐朝、罗马" aria-label="搜索历史事件"><button id="find">搜索</button></div><div class="canvaswrap" id="wrap"><canvas id="timeline" aria-label="中国与世界历史双轨时间轴"></canvas></div><div class="bottom"><span>金色 · 中国历史　　青色 · 世界历史</span><span>拖动平移 · 滚轮或双指缩放 · 点击节点</span></div></section><section class="cards"><article class="card"><div class="tag">CHINA · 中国</div><h2 id="ctitle"></h2><p id="cdesc"></p></article><article class="card world"><div class="tag">WORLD · 世界</div><h2 id="wtitle"></h2><p id="wdesc"></p></article></section><div class="foot">历史年代与分期存在研究差异；本网站为精选历史对照原型，非完整历史数据库。</div></main><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="历史事件展厅"><article class="museum"><button class="close" id="close" aria-label="关闭">×</button><div class="tag" id="mtag"></div><h2 id="mtitle"></h2><p id="mdesc"></p><div class="source" id="msource"></div></article></div><script>

{y:-509,t:'罗马共和国',c:'world',d:'罗马共和国传统建国年代约为公元前509年；早期史料存在传说与后世记述。',s:'https://www.britannica.com/place/Roman-Republic'},

{y:476,t:'西罗马帝国终结',c:'world',d:'西罗马皇帝罗慕路斯·奥古斯都被废黜，476年常作为西罗马帝国终结的传统标志。',s:'https://www.britannica.com/place/Roman-Empire'},

{y:750,t:'阿拔斯王朝建立',c:'world',d:'阿拔斯革命推翻倭马亚王朝，阿拔斯哈里发政权建立。',s:'https://www.britannica.com/topic/Abbasid-caliphate'},
{y:751,t:'怛罗斯之战',c:'cn',d:'唐朝军队与阿拔斯方面在中亚发生冲突。对该战役长期影响的解释需区分史料与后世推断。',s:'https://www.britannica.com/topic/Tang-dynasty'},

{y:1492,t:'哥伦布抵达美洲',c:'world',d:'哥伦布航行抵达加勒比地区，成为欧洲与美洲关系变化的重要节点；美洲原住民文明早已长期存在。',s:'https://www.britannica.com/biography/Christopher-Columbus'},
{y:1644,t:'清军入关',c:'cn',d:'清军入关并进入北京；清朝建立于1636年，对全国的统治经历更长的历史过程。',s:'https://www.britannica.com/topic/Qing-dynasty'},
{y:1776,t:'美国独立宣言',c:'world',d:'北美十三殖民地通过《独立宣言》，宣布脱离英国。',s:'https://www.archives.gov/founding-docs/declaration-transcript'},
{y:1789,t:'法国大革命',c:'world',d:'法国大革命爆发，欧洲政治和社会秩序发生重大变化。',s:'https://www.britannica.com/event/French-Revolution'},
{y:1840,t:'第一次鸦片战争',c:'cn',d:'中英鸦片战争爆发，深刻改变近代中国与世界的关系。',s:'https://www.britannica.com/event/Opium-Wars'},
{y:1911,t:'辛亥革命',c:'cn',d:'辛亥革命推翻清朝统治，推动中国由帝制转向共和。',s:'https://www.britannica.com/event/Chinese-Revolution-1911-1912'},
{y:1914,t:'第一次世界大战',c:'world',d:'第一次世界大战爆发，波及欧洲及世界多个地区。',s:'https://www.britannica.com/event/World-War-I'},
{y:1945,t:'第二次世界大战结束',c:'world',d:'第二次世界大战于1945年结束。',s:'https://www.britannica.com/event/World-War-II'},
{y:1949,t:'中华人民共和国成立',c:'cn',d:'1949年10月1日中华人民共和国成立。',s:'https://www.britannica.com/place/China'}
];
const periods=[{a:-1600,b:-1046,t:'商',c:'cn'},{a:-1046,b:-256,t:'周',c:'cn'},{a:-221,b:-206,t:'秦',c:'cn'},{a:-202,b:220,t:'汉',c:'cn'},{a:220,b:589,t:'魏晋南北朝',c:'cn'},{a:581,b:618,t:'隋',c:'cn'},{a:618,b:907,t:'唐',c:'cn'},{a:960,b:1279,t:'宋',c:'cn'},{a:1271,b:1368,t:'元',c:'cn'},{a:1368,b:1644,t:'明',c:'cn'},{a:1636,b:1912,t:'清',c:'cn'},{a:-509,b:-27,t:'罗马共和国',c:'world'},{a:-27,b:476,t:'罗马帝国（西部）',c:'world'},{a:750,b:1258,t:'阿拔斯王朝',c:'world'},{a:1206,b:1368,t:'蒙古帝国时期',c:'world'},{a:1400,b:1600,t:'欧洲文艺复兴',c:'world'},{a:1760,b:1840,t:'工业革命早期',c:'world'}];
const canvas=document.getElementById('timeline'),ctx=canvas.getContext('2d'),wrap=document.getElementById('wrap');let center=750,scale=.23,drag=false,lastX=0,moved=false,touches=0,pinchDist=0;
const fmt=y=>y<=0?'前'+(1-y)+'年':'公元 '+Math.round(y)+' 年';const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const pos=y=>(y-center)*scale+canvas.clientWidth/2;const year=x=>center+(x-canvas.clientWidth/2)/scale;
function resize(){const r=wrap.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);draw()}new ResizeObserver(resize).observe(wrap);
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);const step=[1,2,5,10,20,50,100,200,500,1000].find(n=>n*scale>=70)||1000;ctx.font='11px sans-serif';ctx.textAlign='center';for(let y=Math.ceil(year(0)/step)*step;y<=year(w);y+=step){let x=pos(y);ctx.strokeStyle='#ffffff15';ctx.beginPath();ctx.moveTo(x,22);ctx.lineTo(x,h-15);ctx.stroke();ctx.fillStyle='#8799ac';ctx.fillText(fmt(y),x,16)}for(const [c,py,color] of [['cn',90,'#c9a46a'],['world',245,'#79b9d2']]){ctx.fillStyle=color;ctx.font='600 15px sans-serif';ctx.textAlign='left';ctx.fillText(c==='cn'?'中国历史':'世界历史',18,py-35);ctx.strokeStyle=color+'66';ctx.beginPath();ctx.moveTo(0,py+15);ctx.lineTo(w,py+15);ctx.stroke();for(const p of periods.filter(p=>p.c===c)){let a=pos(p.a),b=pos(p.b);if(b<0||a>w)continue;ctx.fillStyle=color+'44';ctx.fillRect(Math.max(0,a),py,Math.max(1,Math.min(w,b)-Math.max(0,a)),29);if(b-a>40){ctx.fillStyle='#e7e5db';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText(p.t,clamp((a+b)/2,32,w-32),py+19)}}const visible=events.filter(e=>e.c===c&&pos(e.y)>-20&&pos(e.y)<w+20);let last=-999;for(const e of visible){let x=pos(e.y);ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,py+15,4,0,Math.PI*2);ctx.fill();if(x-last>110&&scale>.15){ctx.fillStyle='#c5d1dc';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText(e.t,x,py+53);last=x}}}ctx.strokeStyle='#f0d3a2';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(w/2,28);ctx.lineTo(w/2,h-22);ctx.stroke();ctx.fillStyle='#f0d3a2';ctx.beginPath();ctx.arc(w/2,105,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(w/2,260,5,0,Math.PI*2);ctx.fill()}
function update(){center=clamp(center,-1600,1949);document.getElementById('date').textContent=fmt(Math.round(center));for(const c of ['cn','world']){const sorted=events.filter(e=>e.c===c).sort((a,b)=>Math.abs(a.y-center)-Math.abs(b.y-center));const e=sorted[0];document.getElementById(c==='cn'?'ctitle':'wtitle').textContent=e.t;document.getElementById(c==='cn'?'cdesc':'wdesc').textContent=fmt(e.y)+' · '+e.d}draw()}
function zoom(f,x=canvas.clientWidth/2){const anchor=year(x);scale=clamp(scale*f,.065,6);center=anchor-(x-canvas.clientWidth/2)/scale;update()}
wrap.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&touches>0)return;drag=true;moved=false;lastX=e.clientX;wrap.setPointerCapture(e.pointerId)});wrap.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lastX;if(Math.abs(dx)>2)moved=true;center-=dx/scale;lastX=e.clientX;update()});wrap.addEventListener('pointerup',e=>{drag=false;if(moved)return;const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,c=y<210?'cn':'world',target=year(x);const candidates=events.filter(ev=>ev.c===c).sort((a,b)=>Math.abs(a.y-target)-Math.abs(b.y-target));if(candidates.length&&Math.abs(pos(candidates[0].y)-x)<24)show(candidates[0])});wrap.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.0015),e.clientX-canvas.getBoundingClientRect().left)},{passive:false});
wrap.addEventListener('touchstart',e=>{if(e.touches.length===2){drag=false;pinchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}},{passive:true});wrap.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinchDist)zoom(d/pinchDist,((e.touches[0].clientX+e.touches[1].clientX)/2)-canvas.getBoundingClientRect().left);pinchDist=d}},{passive:false});
function show(e){document.getElementById('mtag').textContent=(e.c==='cn'?'中国历史':'世界历史')+' · '+fmt(e.y);document.getElementById('mtitle').textContent=e.t;document.getElementById('mdesc').textContent=e.d;document.getElementById('msource').innerHTML='参考资料：<a target="_blank" rel="noopener noreferrer" href="'+e.s+'">查看参考来源 ↗</a><p>注：部分事件采用约略年代定位，具体历史解释应以可靠史料为准。</p>';document.getElementById('overlay').classList.add('open')}
document.getElementById('close').onclick=()=>document.getElementById('overlay').classList.remove('open');document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')e.target.classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('overlay').classList.remove('open');if(e.target.tagName==='INPUT')return;if(e.key==='ArrowLeft'){center-=30;update()}if(e.key==='ArrowRight'){center+=30;update()}if(e.key==='+')zoom(1.4);if(e.key==='-')zoom(1/1.4)});document.getElementById('plus').onclick=()=>zoom(1.5);document.getElementById('minus').onclick=()=>zoom(1/1.5);document.getElementById('back').onclick=()=>{center-=100;update()};document.getElementById('forward').onclick=()=>{center+=100;update()};document.getElementById('home').onclick=()=>{center=750;scale=.23;update()};document.getElementById('random').onclick=()=>{let e=events[Math.floor(Math.random()*events.length)];center=e.y;scale=1;update();show(e)};function search(){let q=document.getElementById('search').value.trim();if(!q)return;let e=events.find(x=>x.t.includes(q)||x.d.includes(q));if(e){center=e.y;scale=1;update();show(e)}else alert('暂未收录该事件，后续会持续扩充。')}document.getElementById('find').onclick=search;document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')search()});update();
</script></body></html>
