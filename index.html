ctx.font='10.5px sans-serif';
const textWidth=ctx.measureText(e.t).width;
const maxLabel=mobile?88:126;
if(textWidth>maxLabel)continue;
const left=x-textWidth/2-5,right=x+textWidth/2+5;
if(left<8||right>w-8)continue;
const lane=labelLanes.findIndex(boxes=>!boxes.some(b=>left<b.right+12&&right>b.left-12));
if(lane<0)continue;
labelLanes[lane].push({left,right});
const ly=py+50+lane*22;
ctx.strokeStyle=color+'70';ctx.beginPath();ctx.moveTo(x,py+30);ctx.lineTo(x,ly-14);ctx.stroke();
ctx.fillStyle='#d2dce4';ctx.textAlign='center';ctx.fillText(e.t,x,ly);
}
}
ctx.strokeStyle='#f0d3a2';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(w/2,25);ctx.lineTo(w/2,h-12);ctx.stroke();
for(const tr of tracks){ctx.fillStyle='#f0d3a2';ctx.beginPath();ctx.arc(w/2,tr.py+16,5,0,Math.PI*2);ctx.fill()}
}
function update(){center=clamp(center,-1600,1949);document.getElementById('date').textContent=fmt(Math.round(center));for(const c of ['cn','world']){const sorted=events.filter(e=>e.c===c).sort((a,b)=>Math.abs(a.y-center)-Math.abs(b.y-center));const e=sorted[0];document.getElementById(c==='cn'?'ctitle':'wtitle').textContent=e.t;document.getElementById(c==='cn'?'cdesc':'wdesc').textContent=fmt(e.y)+' · '+e.d}draw()}
function zoom(f,x=canvas.clientWidth/2){const anchor=year(x);scale=clamp(scale*f,.065,6);center=anchor-(x-canvas.clientWidth/2)/scale;update()}
wrap.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&touches>0)return;drag=true;moved=false;lastX=e.clientX;wrap.setPointerCapture(e.pointerId)});wrap.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lastX;if(Math.abs(dx)>2)moved=true;center-=dx/scale;lastX=e.clientX;update()});wrap.addEventListener('pointerup',e=>{drag=false;if(moved)return;const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,c=y<(canvas.clientWidth<680?190:222)?'cn':'world',target=year(x);const candidates=events.filter(ev=>ev.c===c).sort((a,b)=>Math.abs(a.y-target)-Math.abs(b.y-target));if(candidates.length&&Math.abs(pos(candidates[0].y)-x)<24)show(candidates[0])});wrap.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.0015),e.clientX-canvas.getBoundingClientRect().left)},{passive:false});
wrap.addEventListener('touchstart',e=>{if(e.touches.length===2){drag=false;pinchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}},{passive:true});wrap.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinchDist)zoom(d/pinchDist,((e.touches[0].clientX+e.touches[1].clientX)/2)-canvas.getBoundingClientRect().left);pinchDist=d}},{passive:false});
function storyFor(e){if(e.y>=-250&&e.y<=-180)return "qin";if(e.y>=618&&e.y<=800)return "tang";if(e.y>=1368&&e.y<=1500)return "ocean";return ""}
function show(e){document.getElementById('mtag').textContent=(e.c==='cn'?'中国历史':'世界历史')+' · '+fmt(e.y);document.getElementById('mtitle').textContent=e.t;document.getElementById('mdesc').textContent=e.d;document.getElementById('msource').innerHTML='参考资料：<a target="_blank" rel="noopener noreferrer" href="'+e.s+'">查看参考来源 ↗</a><p>注：部分事件采用约略年代定位，具体历史解释应以可靠史料为准。</p>';document.getElementById('storyAction').innerHTML=storyFor(e)?'<a class="story-link" href="./museum.html?story='+storyFor(e)+'&from='+encodeURIComponent(Math.round(center))+'">进入沉浸式专题展厅 →</a>':'';document.getElementById('overlay').classList.add('open')}
document.getElementById('copen').onclick=()=>show(events.filter(e=>e.c==='cn').sort((a,b)=>Math.abs(a.y-center)-Math.abs(b.y-center))[0]);
document.getElementById('wopen').onclick=()=>show(events.filter(e=>e.c==='world').sort((a,b)=>Math.abs(a.y-center)-Math.abs(b.y-center))[0]);
document.getElementById('close').onclick=()=>document.getElementById('overlay').classList.remove('open');document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')e.target.classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('overlay').classList.remove('open');if(e.target.tagName==='INPUT')return;if(e.key==='ArrowLeft'){center-=30;update()}if(e.key==='ArrowRight'){center+=30;update()}if(e.key==='+')zoom(1.4);if(e.key==='-')zoom(1/1.4)});document.getElementById('plus').onclick=()=>zoom(1.5);document.getElementById('minus').onclick=()=>zoom(1/1.5);document.getElementById('back').onclick=()=>{center-=100;update()};document.getElementById('forward').onclick=()=>{center+=100;update()};document.getElementById('museumNav').onclick=()=>{location.href='./museum.html?from='+Math.round(center)};document.getElementById('home').onclick=()=>{center=750;scale=.23;update()};document.getElementById('random').onclick=()=>{let e=events[Math.floor(Math.random()*events.length)];center=e.y;scale=1;update();show(e)};function search(){let q=document.getElementById('search').value.trim();if(!q)return;let e=events.find(x=>x.t.includes(q)||x.d.includes(q));if(e){center=e.y;scale=1;update();show(e)}else alert('暂未收录该事件，后续会持续扩充。')}document.getElementById('find').onclick=search;document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')search()});const incoming=new URLSearchParams(location.search).get("year");if(incoming!==null&&Number.isFinite(Number(incoming)))center=clamp(Number(incoming),-1600,1949);update();
</script></body></html>
